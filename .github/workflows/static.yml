name: Deploy

# Publishes the static app (no backend) to GitHub Pages. The site works fully
# offline-first; accounts, cloud sync, deck sharing and friend challenges light
# up when a backend URL is configured in Community -> Server settings (GitHub
# Pages cannot run the Node/SQLite server itself).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tests and bundled library
        run: |
          npm run check
          npm test
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html manifest.webmanifest sw.js css js icons .nojekyll _site/
          cp data/library.json _site/data/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
