name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: Install jsdom for the browser smoke test (not a project dependency)
        run: npm i --no-save --no-package-lock jsdom@26
      - run: npm test
